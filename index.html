<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>soft_skill.md</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --night: #05070d;
  --deep: #0d1428;
  --sand: #efe3c8;
  --dim: #8a8f9e;
  --or: #ff8a4c;
  --bl: #6aa8ff;
  --gr: #4fe0a4;
  --ax: var(--sand);
  --font: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
}
:root[data-theme="light"] { --night: #05070d; }
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(120% 90% at 50% 45%, var(--deep) 0%, var(--night) 62%);
  color: var(--sand); font-family: var(--font); overflow: hidden;
  -webkit-font-smoothing: antialiased; touch-action: pan-y;
}
canvas#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

/* stage */
.stage { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; padding: 6vh 6vw; }
.text { text-align: center; max-width: min(1200px, 92vw); display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2.4vh, 26px); }
.big {
  font-weight: 900; font-size: clamp(38px, 7vw, 124px); line-height: 1.22; letter-spacing: .02em;
  text-wrap: balance; text-shadow: 0 0 28px rgba(5, 7, 13, .95), 0 0 2px rgba(5, 7, 13, .9);
}
.big.mid { font-size: clamp(30px, 5vw, 86px); }
.sub { font-size: clamp(16px, 2vw, 30px); color: var(--dim); font-weight: 400; text-shadow: 0 0 18px rgba(5,7,13,.95); }
.label { font-size: clamp(16px, 2vw, 28px); font-weight: 700; color: var(--ax); letter-spacing: .08em; }
.name { font-size: clamp(14px, 1.4vw, 20px); color: var(--dim); margin-top: 2vh; }
.cover-sub { color: color-mix(in srgb, var(--sand) 88%, transparent); font-weight: 700; }
.cover-name { color: color-mix(in srgb, var(--sand) 72%, transparent); font-size: clamp(15px, 1.5vw, 22px); text-shadow: 0 0 18px rgba(5,7,13,.95); }
.em { color: var(--ax); }
.ch { display: inline-block; opacity: 0; animation: write .32s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d); }
.ch.sp { width: .3em; }
.w { display: inline-block; white-space: nowrap; }
@keyframes write {
  0% { opacity: 0; transform: translateY(.18em) scale(1.35); filter: blur(10px); }
  60% { opacity: 1; filter: blur(0); }
  100% { opacity: 1; transform: none; filter: none; }
}
.fade { opacity: 0; animation: fadein .5s ease forwards; animation-delay: var(--d, .3s); }
@keyframes fadein { to { opacity: 1; } }
.leaving { animation: leave .16s ease forwards !important; }
@keyframes leave { to { opacity: 0; filter: blur(8px); transform: scale(.98); } }

/* diagram captions + labels */
.cap {
  position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 7vh); text-align: center;
  font-weight: 900; font-size: clamp(22px, 3.2vw, 52px); line-height: 1.3; padding: 0 5vw; pointer-events: none;
  text-shadow: 0 0 24px rgba(5,7,13,.95); text-wrap: balance;
}
.labels { position: fixed; inset: 0; pointer-events: none; }
.lab {
  position: absolute; transform: translate(-50%, -50%); white-space: pre; text-align: center; line-height: 1.35; font-weight: 900;
  font-size: clamp(18px, 2.4vw, 38px); opacity: 0; transition: opacity .5s ease; text-shadow: 0 0 18px rgba(5,7,13,1);
}
.lab.on { opacity: 1; }
.lab.edge { font-weight: 700; font-size: clamp(13px, 1.5vw, 22px); color: var(--sand); }
.lab.core { color: var(--sand); font-size: clamp(16px, 2vw, 30px); }
.lab.core.tri {
  font-size: clamp(20px, 2.6vw, 40px); text-shadow: none; color: transparent;
  background: linear-gradient(90deg, var(--or), var(--bl), var(--gr)); -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 0 10px rgba(5,7,13,.9));
}
html[data-theme="oz"] .lab.core.tri { text-shadow: none; filter: drop-shadow(0 0 8px rgba(255,255,255,.95)); }
.lab.core.fade { animation: coreFade 3.4s ease-in forwards; }
@keyframes coreFade {
  0%   { opacity: 1;   color: var(--sand); filter: none; }
  45%  { opacity: .5;  color: var(--dim);  filter: none; }
  100% { opacity: 0;   color: var(--dim);  filter: blur(7px); }
}
.lab.ask {
  color: var(--sand); font-weight: 700; font-size: clamp(20px, 2.8vw, 44px); letter-spacing: .06em;
  opacity: 0; filter: blur(10px); transform: translate(-50%, calc(-50% + 20px));
  transition: opacity 2.4s ease, filter 2.4s ease, transform 2.8s cubic-bezier(.2, .7, .2, 1);
}
.lab.ask.on { opacity: 1; filter: none; transform: translate(-50%, -50%); }

/* hud */
.hud { position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); font-size: 13px; color: var(--dim); pointer-events: none; display: flex; gap: 14px; align-items: center; }
.meter { width: 46px; height: 4px; background: rgba(239,227,200,.12); border-radius: 2px; overflow: hidden; display: none; }
.meter i { display: block; height: 100%; width: 0; background: var(--sand); }
.mic-on .meter { display: block; }
.progress { position: fixed; left: 0; bottom: 0; height: 2px; background: var(--sand); opacity: .35; transition: width .3s ease; }

.bar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; gap: 6px; align-items: center; padding: 6px; border-radius: 14px;
  background: rgba(13,20,40,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(239,227,200,.12); transition: opacity .3s ease; z-index: 5;
}
.idle .bar { opacity: 0; pointer-events: none; }
.bar button {
  white-space: nowrap;
  font: inherit; font-size: 14px; color: var(--sand); background: transparent; border: 0; border-radius: 10px;
  padding: 8px 12px; cursor: pointer; min-height: 38px;
}
.bar button:hover { background: rgba(239,227,200,.08); }
.bar button:focus-visible { outline: 2px solid var(--bl); outline-offset: 1px; }
.bar button[aria-pressed="true"] { background: rgba(239,227,200,.16); }
.count { font-size: 13px; color: var(--dim); min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
  max-width: min(560px, 90vw); padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.6;
  background: rgba(13,20,40,.92); border: 1px solid rgba(239,227,200,.16); opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 6;
}
.toast.on { opacity: 1; }

/* kanpe */
.notes {
  position: fixed; left: 0; right: 0; bottom: 0; max-height: 40vh; overflow: auto; z-index: 4;
  padding: 14px max(18px, 4vw) calc(env(safe-area-inset-bottom, 0px) + 70px);
  background: linear-gradient(to top, rgba(5,7,13,.97) 70%, rgba(5,7,13,.0)); display: none;
}
.notes.on { display: block; }
.notes .legend { font-size: 12px; color: var(--dim); margin: 0 0 8px; line-height: 1.7; }
.notes p { margin: 0 0 4px; font-size: clamp(15px, 1.6vw, 20px); line-height: 1.75; max-width: 70em; }
.notes .mode { color: var(--or); font-weight: 700; }
.notes .sub { color: var(--dim); padding-left: 1em; }
.notes .slow { font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--or); }
.notes .pause { color: var(--dim); }
.notes .soft { color: var(--dim); font-style: italic; }
.khead { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; }
.khead .legend { margin: 0 0 8px; }
.ktimer, .timer-btn { font-variant-numeric: tabular-nums; }
.ktimer { font-size: clamp(20px, 2.4vw, 30px); font-weight: 700; color: var(--sand); white-space: nowrap; }
.warn { color: var(--or) !important; }
.over { color: #ff6b6b !important; }
.timer-btn { min-width: 74px; font-weight: 700; }
.tlim { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 12px; color: var(--sand); }
.tlim input { font: inherit; width: 64px; color: var(--sand); background: rgba(239,227,200,.06); border: 1px solid rgba(239,227,200,.18); border-radius: 8px; padding: 6px 8px; }
.tlim input:focus-visible { outline: 2px solid var(--bl); outline-offset: 1px; }
.notes .next { color: var(--bl); font-size: 13px; margin-top: 6px; }
.notes .heard { color: var(--dim); font-size: 13px; }

/* trigger settings */
.cfg { position: fixed; inset: 0; z-index: 9; display: none; background: rgba(5,7,13,.86); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.cfg.on { display: block; }
.cfg-box { max-width: 760px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px); }
.cfg h2 { font-size: 20px; margin: 0 0 4px; }
.cfg .hint { font-size: 13px; color: var(--dim); line-height: 1.7; margin: 0 0 12px; }
.cfg-list { flex: 1; overflow: auto; border-top: 1px solid rgba(239,227,200,.12); }
.cfg-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1.1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(239,227,200,.08); }
.cfg-row .n { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.cfg-row .t { font-size: 14px; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; }
.cfg-row.cur .t { color: var(--or); }
.cfg-row input { font: inherit; font-size: 14px; color: var(--sand); background: rgba(239,227,200,.06); border: 1px solid rgba(239,227,200,.18); border-radius: 8px; padding: 7px 9px; min-width: 0; }
.cfg-row input:focus-visible { outline: 2px solid var(--bl); outline-offset: 1px; }
.cfg-row input::placeholder { color: var(--dim); }
.cfg-row input.set { border-color: var(--or); }
.cfg-foot { display: flex; gap: 8px; padding-top: 12px; flex-wrap: wrap; }
.cfg-foot button { font: inherit; font-size: 14px; color: var(--sand); background: rgba(239,227,200,.08); border: 1px solid rgba(239,227,200,.16); border-radius: 10px; padding: 9px 14px; cursor: pointer; min-height: 40px; }
.cfg-foot button:hover { background: rgba(239,227,200,.16); }
.cfg-foot button:focus-visible { outline: 2px solid var(--bl); outline-offset: 1px; }
.cfg-foot .grow { margin-left: auto; }
/* ===== theme: OZ (Summer Wars) — colors only ===== */
html[data-theme="oz"] {
  --night: #e5e2fa; --deep: #ffffff; --sand: #1c1a33; --dim: #6f6c8f;
  --or: #ff3d8b; --bl: #1e9bea; --gr: #58ab00;
}
html[data-theme="oz"] .cover-name, html[data-theme="oz"] .big, html[data-theme="oz"] .sub, html[data-theme="oz"] .cap, html[data-theme="oz"] .lab {
  text-shadow: 0 0 22px rgba(255,255,255,.95), 0 0 3px rgba(255,255,255,.9);
}
html[data-theme="oz"] .progress { height: 5px; opacity: .9; background: linear-gradient(90deg, #ff4b4b, #ff9a2e, #ffd426, #5fd36a, #27c4e8, #4b7bff, #a35cf0); }
html[data-theme="oz"] .meter { background: rgba(28,26,51,.12); }
html[data-theme="oz"] .bar { background: rgba(255,255,255,.82); border-color: rgba(60,50,120,.16); }
html[data-theme="oz"] .bar button:hover { background: rgba(60,50,120,.07); }
html[data-theme="oz"] .bar button[aria-pressed="true"] { background: rgba(60,50,120,.13); }
html[data-theme="oz"] .toast { background: rgba(255,255,255,.97); border-color: rgba(60,50,120,.18); }
html[data-theme="oz"] .notes { background: linear-gradient(to top, rgba(246,244,255,.98) 70%, rgba(246,244,255,0)); }
html[data-theme="oz"] .cfg { background: rgba(246,244,255,.94); }
html[data-theme="oz"] .cfg-list { border-top-color: rgba(60,50,120,.14); }
html[data-theme="oz"] .cfg-row { border-bottom-color: rgba(60,50,120,.1); }
html[data-theme="oz"] .cfg-row input, html[data-theme="oz"] .tlim input { background: rgba(60,50,120,.05); border-color: rgba(60,50,120,.22); }
html[data-theme="oz"] .cfg-foot button { background: rgba(60,50,120,.07); border-color: rgba(60,50,120,.18); }
html[data-theme="oz"] .cfg-foot button:hover { background: rgba(60,50,120,.14); }

@media (max-width: 640px) { .cfg-row { grid-template-columns: 26px minmax(0, 1fr); } .cfg-row input { grid-column: 2; } }
@media (max-width: 640px) {
  .bar { max-width: 96vw; overflow-x: auto; }
  .bar button { padding: 8px 7px; font-size: 12px; }
  .hud .file { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .ch { animation-duration: .01s; animation-delay: 0s !important; }
}
</style>
</head>
<body class="idle">
<canvas id="field" aria-hidden="true"></canvas>
<div class="labels" id="labels" aria-hidden="true"></div>
<div class="cap" id="cap"></div>
<main class="stage"><div class="text" id="text" aria-live="polite"></div></main>

<div class="hud" id="hud"><span class="file">soft_skill.md</span><span class="meter"><i id="meterFill"></i></span></div>
<div class="progress" id="progress"></div>

<section class="notes" id="notes" aria-label="カンペ">
  <div class="khead"><p class="legend">／ 短い間　／／ 2秒黙る　《 》 ゆっくり1音ずつ置く　（小） 声を落として独り言</p><span class="ktimer" id="kTimer">5:00</span></div>
  <div id="notesBody"></div>
</section>

<nav class="bar" id="bar" aria-label="操作">
  <button id="prev" aria-label="前へ">←</button>
  <span class="count" id="count">1 / 1</span>
  <button id="next" aria-label="次へ">→</button>
  <button id="timerBtn" class="timer-btn" title="T：スタート／一時停止（最初のスライドを進めると自動スタート）">5:00</button>
  <button id="timerReset" aria-label="タイマーをリセット" title="R：リセット（停止中のみ）">↺</button>
  <button id="micBtn" aria-pressed="false" title="M：声で球体が動く＋言い終わりでめくる">マイク</button>
  <button id="cfgBtn" title="W">ワード設定</button>
  <button id="themeBtn" title="Y：テーマ切り替え">テーマ</button>
  <button id="notesBtn" aria-pressed="false" title="N">カンペ</button>
  <button id="fsBtn" title="F">全画面</button>
</nav>
<section class="cfg" id="cfg" role="dialog" aria-label="次へ進む言葉の設定">
  <div class="cfg-box">
    <h2>次へ進む言葉</h2>
    <label class="tlim">持ち時間 <input id="tLimit" type="number" min="1" max="60" step="1" value="5"> 分</label>
    <p class="hint">各スライドの言い終わりに話す言葉を入れてください。聞き取れたら次へ進みます。空欄なら、カンペの最後の4文字を自動で使います。複数入れるときは「、」で区切ります。音声認識は漢字の揺れがあるので、短く（3〜5文字）、そのスライドの中で一度しか言わない言葉がおすすめです。</p>
    <div class="cfg-list" id="cfgList"></div>
    <div class="cfg-foot">
      <button id="cfgReset">初期設定に戻す</button>
      <button id="cfgCopy">設定をコピー</button>
      <button id="cfgPaste">貼り付けて読み込む</button>
      <button id="cfgClose" class="grow">閉じる</button>
    </div>
  </div>
</section>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  // ---------- content ----------
  // t: big | lack | pair | cover | diagram ; shape: sphere | scatter | venn | loop
  var S = [];
  function big(h, note, k, o) { o = o || {}; S.push({ t: 'big', h: h, s: o.s, ax: o.ax, mid: o.mid, fx: o.fx, shape: o.shape || 'sphere', note: note, k: k || [] }); }
  function lack(label, h, ax, note, k) { S.push({ t: 'lack', label: label, h: h, ax: ax, shape: 'sphere', note: note, k: k }); }

  S.push({ t: 'cover', h: '社会性って、なんだと思う？', s: '主体性・人間性・専門性、3つのキーワードの話', name: 'yozure / LIFT 代表', shape: 'sphere',
    note: '【0:00｜全体】どうも、yozureです。／ いきなりなんですけど、《社会性って》、なんだと思います。', k: [] });
  big('あなたにとって、社会性って？', '【全体】じゃあ、自分は社会性ある、って思う人。【1人に】手を挙げた人を当てて「社会性って、なんだと思います？」（答えを受けて）……わかるなぁ。　※ここまで30秒', ['どうですか', 'なんだと思', '何だと思', 'どうでしょう']);

  big('僕の考えだと、3つ', '【0:30｜全体】僕の考えだと、3つに分けられます。', ['僕の考え', '3つに', '三つに', '分けられ']);
  big('**主体性**', 'まず、自分で考えて動く、《主体性》。', ['主体性', '自分で考え'], { s: '自分で考えて、動く', ax: 'or', fx: 'grow' });
  big('**人間性**', '人と協働する、《人間性》。', ['人間性', '協働', '協調'], { s: '人と、協働する', ax: 'bl', fx: 'heart' });
  big('**専門性**', '知識やスキルの、《専門性》。', ['専門性', '知識', 'スキル'], { s: '知識と、スキル', ax: 'gr', fx: 'tech' });
  S.push({ t: 'diagram', cap: 'このバランスが、社会性', shape: 'venn', note: 'この3つのバランスを、僕は社会性って呼んでます。', k: ['バランス', '社会性って呼'] });
  big('1つ欠けると、わかりやすい', 'どれか1つ欠けると、すごくわかりやすいんですよ。', ['欠ける', 'かける', 'わかりやすい', '分かりやすい']);

  lack('主体性が欠けると', '「教えてもらってないので、できません」', 'or', '主体性が欠けると……「教えてもらってないので、できません」。／ 周りに、いません？／ うなずかなくて大丈夫です。頭に思い浮かべるだけで。', ['教えて', '主体性が']);
  lack('人間性が欠けると', '同僚と、うまくやっていけない', 'bl', '人間性が欠けると、同僚とうまくやっていけない。', ['人間性が', '同僚']);
  big('どんなに優秀でも、浮いちゃう', 'どんなに優秀でも、チームの中で浮いちゃう。', ['優秀', '浮い']);
  lack('専門性が欠けると', 'できないのに、「できます」', 'gr', '専門性が欠けると、できないのに「できます」って手を挙げちゃう。', ['専門性が', 'できます', '手を挙げ']);
  big('自分の範囲が、わかってない', '自分の知識の範囲がわかってないと、どこまでできるか、わからないんです。', ['範囲', 'どこまで']);

  big('1本だけ尖っても、ダメ', '【1:50｜全体】だから、1本だけ尖ってればいい、ってわけじゃない。', ['尖っ', 'とがっ', '一本', '1本'], { shape: 'spike' });
  big('「技術だけじゃダメ」は、よく聞く', '技術のことだけやってればいいわけじゃない、って話は、たぶんずっと聞いてますよね。', ['技術のこと', '技術だけ', '聞いて']);
  big('でも、具体的にどうする？', 'でも、じゃあ具体的にどこをどうすればいいのか。／ それは、まだ聞いたことないと思うんです。', ['具体的']);
  big('今日は、その話', '今日は、その話をします。', ['今日は', 'その話', '話をします', '話させ']);

  big('全部そろってないと、ダメ？', '【2:05｜全体】じゃあ、全部そろってないと《ダメ》なのか。／／', ['全部', 'そろって', '揃って']);
  big('そんなことは、ない', 'そんなことは、ない。', ['そんなこと']);
  big('正直、僕は技術にコンプレックスがある', '【独り言】（小）正直に言うと、僕、技術にコンプレックスがあるんですよ。', ['正直', 'コンプレックス'], { mid: true });
  big('このLT、何話そう？', '【全体】このLT、何話そうかなって考えたとき、', ['何話そう', 'なに話そう', 'lt', 'エルティー']);
  big('周りの技術力を見たら', '周りの人の技術力を見たら、', ['技術力', '周りの人']);
  big('自分の話が、霞んで見えた', '自分の話が、《霞んで》見えたんです。', ['霞', 'かすん']);
  big('絞り出して、この話に決めた', '絞り出して、絞り出して、じゃあこのコンプレックスの話をしよう、って決めました。', ['絞り出', 'しぼりだ', '決めた']);

    rec.onend = function () { if (auto) { try { rec.start(); } catch (_) {} } };
    try { rec.start(); } catch (_) {}
  }
  async function toggleMic() {
    if (micOn) { stopMic(); return; }
    if (!(await startMic())) return;
    if (SR) {
      auto = true; consumed = heardText().length; startRec();
      toast('マイクオン：声で球体が動き、スライドの言い終わりで次へ進みます。←→で手動でも動かせます。');
    } else {
      toast('マイクオン（球体だけ）。このブラウザは声でめくれません。Chromeで開いてください。');
    }
    renderNotes();
  }

  // ---------- trigger settings ----------
  var cfgEl = $('cfg'), cfgList = $('cfgList');
  function slideTitle(sl) { return String(sl.h || sl.cap || sl.label || '').replace(/\*\*/g, ''); }
  function buildCfg() {
    cfgList.innerHTML = '';
    S.forEach(function (sl, i) {
      var row = document.createElement('div'); row.className = 'cfg-row' + (i === cur ? ' cur' : ''); row.id = 'cfgrow' + i;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
      var t = document.createElement('span'); t.className = 't'; t.textContent = slideTitle(sl);
      var inp = document.createElement('input'); inp.type = 'text'; inp.autocomplete = 'off';
      inp.value = CUSTOM[i] || ''; inp.placeholder = i < S.length - 1 ? ('自動：' + (tailKey(sl) || '—')) : '最後のスライド';
      inp.disabled = i === S.length - 1; inp.className = inp.value ? 'set' : '';
      inp.setAttribute('aria-label', (i + 1) + '枚目から次へ進む言葉');
      inp.oninput = function () {
        if (inp.value.trim()) CUSTOM[i] = inp.value; else delete CUSTOM[i];
        inp.className = inp.value.trim() ? 'set' : ''; saveCustom();
      };
      row.appendChild(n); row.appendChild(t); row.appendChild(inp); cfgList.appendChild(row);
    });
  }
  function openCfg() {
    buildCfg(); cfgEl.classList.add('on');
    var r = $('cfgrow' + cur); if (r) r.scrollIntoView({ block: 'center' });
  }
  function closeCfg() { cfgEl.classList.remove('on'); renderNotes(); }
  $('cfgBtn').onclick = openCfg;
  $('cfgClose').onclick = closeCfg;
  $('cfgReset').onclick = function () { CUSTOM = JSON.parse(JSON.stringify(DEFAULTS)); saveCustom(); buildCfg(); toast('初期設定に戻しました。'); };
  $('cfgCopy').onclick = function () {
    var txt = JSON.stringify(CUSTOM);
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('設定をコピーしました。'); }, function () { window.prompt('コピーしてください', txt); });
  };
  $('cfgPaste').onclick = function () {
    var v = window.prompt('コピーした設定を貼り付けてください');
    if (!v) return;
    try { var o = JSON.parse(v); if (o && typeof o === 'object' && !Array.isArray(o)) { CUSTOM = {}; Object.keys(o).forEach(function (k) { if (/^\d+$/.test(k) && +k < S.length && typeof o[k] === 'string') CUSTOM[k] = o[k]; }); saveCustom(); buildCfg(); toast('設定を読み込みました。'); } } catch (_) { toast('読み込めませんでした。'); }
  };

  // ---------- timer ----------
  var T = { run: false, el: 0, last: 0, limit: 5 };
  try { var lm = parseInt(localStorage.getItem('ss_timer_min'), 10); if (lm >= 1 && lm <= 60) T.limit = lm; } catch (_) {}
  function fmtT() {
    var rem = T.limit * 60000 - T.el, over = rem < 0, a = Math.abs(rem), sec = over ? Math.floor(a / 1000) : Math.ceil(a / 1000);
    return { txt: (over ? '+' : '') + Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2), warn: !over && rem <= 60000, over: over };
  }
  function drawTimer() {
    var f = fmtT();
    ['timerBtn', 'kTimer'].forEach(function (id) {
      var el = $(id); if (!el) return;
      el.textContent = f.txt; el.classList.toggle('warn', f.warn); el.classList.toggle('over', f.over);
    });
    $('timerBtn').setAttribute('aria-label', 'タイマー ' + f.txt + (T.run ? '（動作中）' : '（停止中）'));
  }
  function startTimer() { if (T.run) return; T.run = true; T.last = performance.now(); }
  function pauseTimer() { if (!T.run) return; T.el += performance.now() - T.last; T.run = false; }
  function toggleTimer() { T.run ? pauseTimer() : startTimer(); drawTimer(); }
  function resetTimer() { if (T.run) { toast('止めてからリセットしてください。'); return; } T.el = 0; drawTimer(); }
  setInterval(function () {
    if (T.run) { var n = performance.now(); T.el += n - T.last; T.last = n; }
    drawTimer();
  }, 250);
  $('timerBtn').onclick = toggleTimer;
  $('timerReset').onclick = resetTimer;
  $('tLimit').value = T.limit;
  $('tLimit').oninput = function () {
    var v = parseInt($('tLimit').value, 10);
    if (v >= 1 && v <= 60) { T.limit = v; try { localStorage.setItem('ss_timer_min', String(v)); } catch (_) {} drawTimer(); }
  };

  // ---------- theme ----------
  function buildPalettes() {
    var th = THEMES[themeName]; RB = null; RC = null;
    if (!N || !P.by) return;
    if (th.rainbow) { RB = new Array(N); for (var i = 0; i < N; i++) RB[i] = th.rainbow[Math.min(6, Math.floor((P.by[i] + 1) / 2 * 7))]; }
    if (th.confetti) { RC = new Array(N); for (var j = 0; j < N; j++) RC[j] = th.confetti[(j * 7 + 3) % th.confetti.length]; }
  }
  function applyTheme(name, quiet) {
    if (!THEMES[name]) name = 'night';
    themeName = name;
    var th = THEMES[name];
    SAND = th.sand; COL = th.col; AXC = th.axc;
    document.documentElement.setAttribute('data-theme', name === 'night' ? '' : name);
    document.documentElement.style.setProperty('--ax', S[cur] ? axFor(S[cur]) : 'var(--sand)');
    buildPalettes();
    if (S[cur]) dimText = dimFor(S[cur]);
    if (labelEls.length && S[cur]) buildLabels(S[cur]);
    try { localStorage.setItem('ss_theme', name); } catch (_) {}
    if (!quiet) toast('テーマ：' + (name === 'oz' ? 'OZ（明るい）' : 'ナイト（暗い）'));
  }
  $('themeBtn').onclick = function () { applyTheme(themeName === 'night' ? 'oz' : 'night'); };

  // ---------- ui ----------
  var toastT;
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { toastEl.classList.remove('on'); }, 3600); }
  function toggleNotes() { var on = !notesEl.classList.contains('on'); notesEl.classList.toggle('on', on); $('notesBtn').setAttribute('aria-pressed', String(on)); }
  function toggleFs() { if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); } else { document.exitFullscreen(); } }

  $('prev').onclick = function () { go(cur - 1); };
  $('next').onclick = function () { go(cur + 1); };
  $('micBtn').onclick = toggleMic;
  $('notesBtn').onclick = toggleNotes;
  $('fsBtn').onclick = toggleFs;
  // マウスやタッチで押したボタンにフォーカスを残さない（次のスペースキーは「めくる」に使う）
  $('bar').addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0) b.blur(); });

  document.addEventListener('keydown', function (e) {
    var tg = e.target;
    if (tg && tg.tagName === 'INPUT') { if (e.key === 'Escape') closeCfg(); return; }
    if (cfgEl.classList.contains('on')) { if (e.key === 'Escape' || e.key === 'w' || e.key === 'W') closeCfg(); return; }
    if (tg.closest && tg.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === ' ' || k === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (k === 'n' || k === 'N') toggleNotes();
    else if (k === 'm' || k === 'M') toggleMic();
    else if (k === 'f' || k === 'F') toggleFs();
    else if (k === 'y' || k === 'Y') applyTheme(themeName === 'night' ? 'oz' : 'night');
    else if (k === 't' || k === 'T') toggleTimer();
    else if (k === 'r' || k === 'R') { if (!T.run) resetTimer(); }
    else if (k === 'w' || k === 'W') openCfg();
    else if (k === 'Home') go(0);
    else if (k === 'End') go(S.length - 1);
  });
  var sx = null;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  var idleT;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(function () { document.body.classList.add('idle'); }, 2600); }
  ['mousemove', 'touchstart', 'keydown'].forEach(function (ev) { document.addEventListener(ev, wake, { passive: true }); });

  window.addEventListener('resize', resize);
  resize();
  var savedTheme = 'night';
  try { savedTheme = localStorage.getItem('ss_theme') || 'night'; } catch (_) {}
  applyTheme(savedTheme, true);
  var startPage = pageFromHash();
  if (startPage >= 0) cur = startPage;
  render();
  shape = 'scatter';
  setTimeout(function () { setShape(S[cur]); }, 250);
  requestAnimationFrame(frame);
  wake();
})();
</script>
</body>
</html>
